run:
  name: fixture
  fail_on: high
  fail_on_llm_assisted: false
  max_concurrency: 4
  tool_timeout_s: 1
  clock_override: null

target:
  transport: stdio
  command: python
  args: ["tests/fixtures/fake_catalog_server.py"]

probing:
  mode: safe
  allowlist: []
  denylist: ["update_*", "create_*", "set_*", "remove_*"]
  max_probes_per_tool: 1
  fixtures_file: ./tests/fixtures/probe_fixtures.fixture.yaml
  llm_generated_inputs: true
  seed_values:
    asset_id: ["tbl_orders", "col_email"]
    schema_name: ["sales"]

llm:
  enabled: true
  classifier_model: "anthropic:claude-haiku-4-5-20251001"
  planner_model: "anthropic:claude-sonnet-5"
  temperature: 0
  batch_size: 25
  send_values: truncated
  max_value_chars: 200
  min_confidence: 0.7
  crosscheck_labelled_certified: false
  cache_dir: .mcpaudit_cache

redaction:
  extra_patterns: []

policy_file: ./configs/policy.default.yaml

static_scan:
  enabled: false
  repo_path: ../oe_mcp
  include: ["**/*.py", "**/*.js", "**/*.ts", "**/*.mjs", "**/*.go", "**/*.java"]
  exclude: ["tests/**", ".venv/**", "**/site-packages/**"]
  telemetry_flush_function_names: ["flush_telemetry"]
  tool_decorator_patterns: ["*.tool", "*.call_tool", "*.route", "*.get", "*.post"]

review:
  enabled: false

output:
  dir: ./reports
  formats: [json, md]
  save_raw: true
  include_classifications: true
